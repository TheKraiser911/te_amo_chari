<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Juego de Amor 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #ffe4e1;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #contenedor-juego {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 720px;
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            border: 4px solid #ff69b4;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        /* Interfaz de usuario superior */
        #interfaz {
            display: none;
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }
        .placa-info {
            background: rgba(255, 255, 255, 0.85);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ff1493;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* Línea del suelo del Amor */
        #linea-suelo {
            position: absolute;
            bottom: 110px;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(90deg, #ff69b4, #ff69b4 10px, transparent 10px, transparent 20px);
            z-index: 5;
        }
        /* Elementos móviles */
        .jugador {
            position: absolute;
            bottom: 120px; 
            width: 60px;
            height: 60px;
            background-size: cover;
            background-position: center;
            z-index: 6;
        }
        .caedor {
            position: absolute;
            width: 55px;
            height: 55px;
            background-size: cover;
            background-position: center;
            z-index: 6;
        }
        .corazon {
            position: absolute;
            width: 25px;
            height: 25px;
            background-image: url('corazon.png');
            background-size: cover;
            background-position: center;
            z-index: 7;
        }

        /* MENU DE SELECCIÓN */
        #pantalla-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #pantalla-menu h1 { color: #ff1493; margin-bottom: 30px; font-size: 28px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .btn-menu {
            width: 85%;
            padding: 15px;
            margin: 10px 0;
            background: white;
            border: 3px solid #ff69b4;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ff1493;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .btn-menu:active { background: #ffe4e1; transform: scale(0.98); }

        /* CONTROLES ANDROID TOTALMENTE OPTIMIZADOS */
        #controles-movil {
            display: none; 
            position: absolute;
            bottom: 15px; 
            left: 15px;
            height: 80px; 
            z-index: 40; /* Por encima del fondo pero permite clicks arriba */
        }
        .grupo-izquierdo { display: flex; gap: 20px; }
        .boton-tactil {
            width: 75px; 
            height: 75px; 
            background: rgba(255, 105, 180, 0.75);
            border: 3px solid #fff; 
            border-radius: 50%; /* Redondos para mejor ergonomía de pulgar tipo Pou */
            color: white;
            font-size: 32px; 
            font-weight: bold; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            touch-action: none;
        }
        .boton-tactil:active { background: #ff1493; transform: scale(0.95); }

        /* PANTALLAS DE FINAL */
        .pantalla-final {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; flex-direction: column; justify-content: center;
            align-items: center; padding: 25px; text-align: center;
        }
        /* Final 1: Tiempo completado (Carta Bonita) */
        #final-tiempo { background: rgba(255, 192, 203, 0.98); }
        .carta-contenido {
            background: white; padding: 25px; border-radius: 15px;
            border: 3px dashed #ff1493; box-shadow: 0 8px 20px rgba(0,0,0,0.15); max-width: 90%;
        }
        .carta-contenido h2 { color: #ff1493; margin-bottom: 15px; font-size: 24px; }
        .carta-contenido p { color: #4a4a4a; font-size: 16px; line-height: 1.5; margin-bottom: 15px; }
        
        /* Final 2: Cruza la línea (NUEVO FONDO DE PANTALLA) */
        #final-linea { 
            background-image: url('fondo_abrazo.png'); 
            background-size: cover;
            background-position: center;
        }
        #mensaje-rojo { color: red; font-size: 36px; font-weight: bold; margin-bottom: 25px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); animation: latido 0.6s infinite alternate; }
        
        /* Contenedor de las dos fotos juntas */
        .contenedor-abrazo-fotos {
            display: block;
            text-align: center;
            margin-bottom: 25px;
        }
        .foto-abrazo {
            display: inline-block;
            width: 110px;
            height: 110px;
            background-size: cover;
            background-position: center;
            border: 4px solid #ff69b4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #foto-el {
            background-image: url('tu_foto.png');
            border-radius: 15px 0 0 15px;
            margin-right: -2px;
        }
        #foto-ella {
            background-image: url('foto_novia.png');
            border-radius: 0 15px 15px 0;
            margin-left: -2px;
        }

        #corazon-central {
            width: 80px; height: 80px; background-image: url('corazon.png');
            background-size: cover; background-position: center; opacity: 0.95; animation: latido 0.6s infinite alternate;
        }

        @keyframes latido {
            from { transform: scale(1); } to { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div id="contenedor-juego">
        <div id="pantalla-menu">
            <h1>¿Quién quieres ser hoy? 💞</h1>
            <button class="btn-menu" onclick="iniciarJuego('leonardo')">Soy Leonardo</button>
            <button class="btn-menu" onclick="iniciarJuego('chari')">Soy Chari</button>
        </div>

        <div id="interfaz">
            <div class="placa-info">Amor: <span id="puntos">0</span></div>
            <div class="placa-info">Tiempo: <span id="tiempo">60</span>s</div>
        </div>

        <div id="linea-suelo"></div>
        <div id="jugador" class="jugador" style="left: 210px;"></div>

        <div id="controles-movil">
            <div class="grupo-izquierdo">
                <div id="btn-izquierda" class="boton-tactil">◀</div>
                <div id="btn-derecha" class="boton-tactil">▶</div>
            </div>
        </div>

        <div id="final-tiempo" class="pantalla-final">
            <div class="carta-contenido">
                <h2 id="titulo-carta"></h2>
                <p id="parrafo-carta-1"></p>
                <p id="parrafo-carta-2"></p>
                <p style="font-weight: bold; color: #ff69b4; font-size: 18px;">¡Eres mi vida entera! ✨👑</p>
            </div>
        </div>

        <div id="final-linea" class="pantalla-final">
            <h1 id="mensaje-rojo">❤️ ¡Te amooooo! ❤️</h1>
            
            <div class="contenedor-abrazo-fotos">
                <div id="foto-el" class="foto-abrazo"></div>
                <div id="foto-ella" class="foto-abrazo"></div>
            </div>

            <div id="corazon-central"></div>
        </div>
    </div>

    <script>
        const contenedor = document.getElementById('contenedor-juego');
        const jugador = document.getElementById('jugador');
        const textoPuntos = document.getElementById('puntos');
        const textoTiempo = document.getElementById('tiempo');
        const controlesMovil = document.getElementById('controles-movil');
        
        let puntos = 0;
        let tiempoRestante = 60;
        let jugadorX = 210;
        const velocidadJugador = 7.5;
        let anchoContenedor = contenedor.clientWidth;
        let juegoActivo = false;
        
        let velocidadCaidaBase = 2.2;
        let tiempoSpawnBase = 1600;
        let intervaloGenerador;

        let modoElegido = ""; 
        let imagenCaedor = ""; 

        function reproducirSonido(ruta, bucle = false) {
            let audio = new Audio(ruta);
            audio.volume = 0.5;
            audio.loop = bucle;
            audio.play().catch(e => {});
            return audio;
        }

        function iniciarJuego(rol) {
            document.getElementById('pantalla-menu').style.display = 'none';
            document.getElementById('interfaz').style.display = 'flex';
            modoElegido = rol;
            juegoActivo = true;

            if (modoElegido === 'leonardo') {
                jugador.style.backgroundImage = "url('tu_foto.png')";
                imagenCaedor = "url('foto_novia.png')";
            } else {
                jugador.style.backgroundImage = "url('foto_novia.png')";
                imagenCaedor = "url('tu_foto.png')";
            }

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                controlesMovil.style.display = 'block';
            }

            intervaloGenerador = setInterval(generarCaedor, tiempoSpawnBase);
            setInterval(reducirTiempo, 1000);
            setInterval(aumentarDificultad, 10000); 

            requestAnimationFrame(actualizarJuego);
        }

        // CONTROL DE ENTRADAS GENERAL
        window.teclas = {};
        let toqueDisparoActivo = false;

        // Teclado (PC)
        window.addEventListener('keydown', (e) => { if(juegoActivo) teclas[e.code] = true; });
        window.addEventListener('keyup', (e) => { teclas[e.code] = false; });
        
        // Mouse (PC) - Click para ráfaga continua
        contenedor.addEventListener('mousedown', (e) => { if(juegoActivo && e.button === 0) teclas['MouseClick'] = true; });
        contenedor.addEventListener('mouseup', () => { teclas['MouseClick'] = false; });

        // CONTROLES TÁCTILES CONTINUOS (MÓVIL)
        document.getElementById('btn-izquierda').addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            e.stopPropagation(); // Evita disparar al tocar el botón
            teclas['ArrowLeft'] = true; 
        });
        document.getElementById('btn-izquierda').addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            teclas['ArrowLeft'] = false; 
        });
        
        document.getElementById('btn-derecha').addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            e.stopPropagation(); // Evita disparar al tocar el botón
            teclas['ArrowRight'] = true; 
        });
        document.getElementById('btn-derecha').addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            teclas['ArrowRight'] = false; 
        });

        // TOQUE EN LA PANTALLA GENERAL PARA DISPARAR (¡Tac tac!)
        contenedor.addEventListener('touchstart', (e) => {
            if (!juegoActivo) return;
            // Solo activa disparo si no está tocando los botones direccionales
            if (e.target.id !== 'btn-izquierda' && e.target.id !== 'btn-derecha') {
                toqueDisparoActivo = true;
            }
        });
        contenedor.addEventListener('touchend', () => {
            toqueDisparoActivo = false;
        });

        let corazones = [];
        let caedores = [];
        let tiempoUltimoDisparo = 0;
        const cadenciaDisparo = 140; 

        function actualizarJuego(tiempoActual) {
            if (!juegoActivo) return;

            // Movimiento continuo (Se mantiene activo mientras el valor sea true)
            if (teclas['ArrowLeft'] || teclas['KeyA']) { if (jugadorX > 0) jugadorX -= velocidadJugador; }
            if (teclas['ArrowRight'] || teclas['KeyD']) { if (jugadorX < anchoContenedor - 60) jugadorX += velocidadJugador; }
            jugador.style.left = jugadorX + 'px';

            // Activar disparo con Teclado, Mouse o Toque rápido de pantalla
            if (teclas['Space'] || teclas['ArrowUp'] || teclas['MouseClick'] || toqueDisparoActivo) {
                if (tiempoActual - tiempoUltimoDisparo > cadenciaDisparo) {
                    crearCorazon();
                    tiempoUltimoDisparo = tiempoActual;
                }
            }

            for (let i = corazones.length - 1; i >= 0; i--) {
                let c = corazones[i];
                c.y -= 9; c.element.style.top = c.y + 'px';
                if (c.y < -30) { c.element.remove(); corazones.splice(i, 1); }
            }

            let limiteSueloY = contenedor.clientHeight - 114;

            for (let i = caedores.length - 1; i >= 0; i--) {
                let n = caedores[i];
                n.y += velocidadCaidaBase;
                n.element.style.top = n.y + 'px';

                for (let j = corazones.length - 1; j >= 0; j--) {
                    let c = corazones[j];
                    if (detectarChoque(c, n)) {
                        c.element.remove(); corazones.splice(j, 1);
                        n.element.remove(); caedores.splice(i, 1);
                        reproducirSonido('sonidos/punto.mp3');
                        puntos++;
                        textoPuntos.innerText = puntos;
                        break; 
                    }
                }

                if (n.y > limiteSueloY) {
                    finalizarAbrazo();
                    return;
                }
            }
            requestAnimationFrame(actualizarJuego);
        }

        function crearCorazon() {
            reproducirSonido('sonidos/disparo.mp3');
            const elem = document.createElement('div');
            elem.className = 'corazon';
            let x = jugadorX + 17;
            let y = contenedor.clientHeight - 175; 
            elem.style.left = x + 'px'; elem.style.top = y + 'px';
            contenedor.appendChild(elem);
            corazones.push({ element: elem, x: x, y: y });
        }

        function generarCaedor() {
            if (!juegoActivo) return;
            const elem = document.createElement('div');
            elem.className = 'caedor';
            elem.style.backgroundImage = imagenCaedor;
            let x = Math.floor(Math.random() * (anchoContenedor - 55));
            let y = -60;
            elem.style.left = x + 'px'; elem.style.top = y + 'px';
            contenedor.appendChild(elem);
            caedores.push({ element: elem, x: x, y: y });
        }

        function detectarChoque(obj1, obj2) {
            return (obj1.x < obj2.x + 52 && obj1.x + 22 > obj2.x && obj1.y < obj2.y + 52 && obj1.y + 22 > obj2.y);
        }

        function aumentarDificultad() {
            if (!juegoActivo) return;
            velocidadCaidaBase += 0.5; 
            if (tiempoSpawnBase > 600) {
                tiempoSpawnBase -= 200; 
                clearInterval(intervaloGenerador);
                intervaloGenerador = setInterval(generarCaedor, tiempoSpawnBase);
            }
        }

        function reducirTiempo() {
            if (!juegoActivo) return;
            tiempoRestante--;
            textoTiempo.innerText = tiempoRestante;

            if (tiempoRestante <= 0) {
                finalizarPorTiempo();
            }
        }

        function finalizarPorTiempo() {
            limpiarPantalla();
            
            const tCarta = document.getElementById('titulo-carta');
            const p1 = document.getElementById('parrafo-carta-1');
            const p2 = document.getElementById('parrafo-carta-2');

            if (modoElegido === 'leonardo') {
                tCarta.innerText = "De: Leonardo para Chari ❤️";
                p1.innerText = "¡Felicidades, mi amor! Lograste aguantar toda la ráfaga de mi amor por un minuto entero.";
                p2.innerText = "Cada segundo que pasa me doy cuenta de que eres lo mejor de mi vida y que este amor crece de forma infinita.";
            } else {
                tCarta.innerText = "De: Leonardo para Chari 💖";
                p1.innerText = "¡Viste que te amo demasiado, Chari hermosa! Programé esto especialmente para ti.";
                p2.innerText = "No importa la velocidad ni las dificultades, mi misión siempre será llenarte de corazones y hacerte sonreír todos los días.";
            }

            document.getElementById('final-tiempo').style.display = 'flex';
        }

        function finalizarAbrazo() {
            limpiarPantalla();
            reproducirSonido('sonidos/abrazo.mp3', true);
            document.getElementById('final-linea').style.display = 'flex';
        }

        function limpiarPantalla() {
            juegoActivo = false;
            toqueDisparoActivo = false;
            for (let i = 1; i < 999; i++) window.clearInterval(i);
            
            corazones.forEach(c => c.element.remove());
            caedores.forEach(n => n.element.remove());
            controlesMovil.style.display = 'none';
        }
    </script>
</body>
</html>
